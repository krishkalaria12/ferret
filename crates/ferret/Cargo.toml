[package]
name = "ferret"
description = "Ferret — an open-source, cross-platform file manager with a terminal that follows you."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ferret"
path = "src/main.rs"

[dependencies]
ferret-settings.workspace = true
ferret-ui.workspace = true
gpui.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui_platform.workspace = true
profiling = { workspace = true, optional = true }

[features]
# Full preview highlighting, forwarded to the UI crate: disabling default
# features here must also disable them there, or a `--no-default-features`
# build still pays for 17 generated-C grammars (and disabling them on the
# workspace root would not, on its own, disable the transitive default).
default = ["ferret-ui/languages-extended"]
# Frame, layout and paint spans in the Tracy profiler.
#
# Off by default and absent from a release build. Enabling it turns on the
# `profiling` facade's Tracy backend for the whole graph, so GPUI's own
# annotations light up with nothing written here — which is what makes the
# per-frame findings in `docs/audit.html` §3 a flame graph rather than
# arithmetic. Needs the Tracy profiler application to connect to.
#
#     cargo run --release --features profile
#
# `puffin` is the self-contained alternative and is a one-line swap here, since
# both sit behind the same facade.
profile = ["dep:profiling", "profiling/profile-with-tracy"]
