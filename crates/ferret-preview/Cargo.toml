[package]
name = "ferret-preview"
description = "Ferret's preview pipeline: classification, budgets, decoding and parsing. GPUI-free."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferret-vfs.workspace = true
csv.workspace = true
dirs.workspace = true
image.workspace = true
markdown.workspace = true
resvg.workspace = true
smallvec.workspace = true
smol.workspace = true
smol_str.workspace = true
thiserror.workspace = true
tiny-skia.workspace = true
usvg.workspace = true
# Paged PDF rendering (F-34, PV-D08). Optional so a fast
# `--no-default-features` build skips it; official builds keep it on, and its
# absence at runtime is a metadata fallback rather than a crash.
pdfium-render = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
default = ["pdf"]
pdf = ["dep:pdfium-render"]