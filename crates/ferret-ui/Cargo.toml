[package]
name = "ferret-ui"
description = "Ferret views, panels, components and theme tokens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ferret-git.workspace = true
ferret-platform.workspace = true
ferret-preview.workspace = true
ferret-search.workspace = true
ferret-settings.workspace = true
ferret-terminal.workspace = true
ferret-vfs.workspace = true
aho-corasick.workspace = true
arc-swap.workspace = true
foldhash.workspace = true
futures.workspace = true
gpui.workspace = true
image.workspace = true
jiff.workspace = true
parking_lot.workspace = true
rayon.workspace = true
smallvec.workspace = true
smol_str.workspace = true

# The built-in grammars behind F-32, one feature per grammar. Never
# optional as a set: a code preview with no colour is a broken feature, not
# a fast build. The extended set (phase 05) lives behind `languages-extended`
# instead, so iterating on anything else can skip those 30 generated-C
# crates without losing the core set.
#
# Deliberately the per-grammar features rather than the `tree-sitter-languages`
# umbrella: the umbrella pulls `tree-sitter-sql`, whose `tree-sitter-sequel`
# pins `cc ~1.2.1` on every 0.3.x — unresolvable against the workspace's
# `cc 1.4.4`, which `ring`, `libsqlite3-sys` and the rest all need. Downgrading
# `cc` for one SQL grammar would risk every native build in the tree, so `.sql`
# previews as labelled plain text until upstream relaxes the pin. 34 of 35.
gpui-component = { workspace = true, features = [
    "tree-sitter-astro",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cmake",
    "tree-sitter-cpp",
    "tree-sitter-csharp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-ejs",
    "tree-sitter-elixir",
    "tree-sitter-erb",
    "tree-sitter-go",
    "tree-sitter-graphql",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-jsdoc",
    "tree-sitter-kotlin",
    "tree-sitter-lua",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-php",
    "tree-sitter-proto",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-scala",
    "tree-sitter-svelte",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-zig",
] }
gpui-component-assets.workspace = true
rust-embed.workspace = true
smol.workspace = true
dirs.workspace = true
serde_json.workspace = true
serde = { workspace = true }

dhat = { workspace = true, optional = true }

[features]
# The allocations-per-frame budget (`docs/audit.html` §11).
#
# Installs dhat as the global allocator for the test binary, so it must be run
# on its own thread to keep other tests' allocations out of the count:
#
#     cargo test -p ferret-ui --features dhat-heap \
#         folder::alloc_budget::frame_allocation_budget -- \
#         --exact --nocapture --test-threads=1
#
# `just budget` does that for you.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
