[package]
name = "ferret-vfs"
description = "Ferret's storage layer: the Vfs trait, the local backend, and per-folder view preferences."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The router's mount table: read on every remote call, written only when a
# mount appears or goes away. `ArcSwap` keeps the read side lock-free, and an
# in-flight listing holds its own `Arc` to the backend, so unmounting mid-walk
# cannot pull the ground out from under it.
arc-swap.workspace = true
async-channel.workspace = true
async-trait.workspace = true
futures.workspace = true
jwalk.workspace = true
notify.workspace = true
parking_lot.workspace = true
rayon.workspace = true
serde = { workspace = true }
smol.workspace = true
smol_str.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
