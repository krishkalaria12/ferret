[workspace]
resolver = "2"
members = [
    "crates/ferret",
    "crates/ferret-git",
    "crates/ferret-platform",
    "crates/ferret-remote",
    "crates/ferret-search",
    "crates/ferret-searchd",
    "crates/ferret-settings",
    "crates/ferret-terminal",
    "crates/ferret-ui",
    "crates/ferret-vfs",
    "xtask",
]
default-members = ["crates/ferret"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/ferret-fm/ferret"

[workspace.dependencies]
# GPUI is tracked from Zed's Git repository. The exact commit is pinned by
# `Cargo.lock`, which is what reproducibility rests on for a binary.
#
# **Do not add a `rev` here.** It is the obvious hygiene fix and it is wrong:
# `gpui-component` declares `gpui = { version = "0.2.2", git = ".../zed" }`
# with no revision of its own, so a `rev` on this line makes a *different*
# source id, and Cargo then compiles two `gpui` crates instead of unifying
# them. That is precisely the "confusing type mismatch errors" failure — tried,
# 217 of them. The pin below on `gpui-component` is safe because nothing else
# in the graph resolves that package.
#
# Bump the GPUI side with `cargo update -p gpui`, deliberately, in its own
# commit; `gpui-component`'s unpinned edge follows it to the same commit, which
# is what keeps them unified.
gpui = { git = "https://github.com/zed-industries/zed" }
# Ferret targets macOS and Windows for now; the Linux backends are not enabled
# here. Note that `gpui-base` still turns `wayland` and `x11` on transitively,
# and Cargo unions features — so this expresses intent rather than excluding
# code from the build. Keep `ferret-platform`'s trait boundary intact so Linux
# is a re-add rather than a rewrite. See D-19.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    # Stitch the Metal shaders and compile them at runtime instead of invoking
    # `xcrun metal` from gpui_macos's build script. Without this, building on macOS
    # requires the Metal compiler, which ships only inside full Xcode — Command Line
    # Tools alone fail with `unable to find utility "metal"`. `gpui-base` already
    # turns this on transitively; we declare it so the macOS build does not silently
    # depend on a feature some other crate happens to enable.
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "f6a93f9da331048b689e35b33a52bab8c7c4034e" }
# Embedded SVGs backing `IconName`. Without registering these as the app's asset
# source, every gpui-component icon renders empty.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "f6a93f9da331048b689e35b33a52bab8c7c4034e" }

ferret-git = { path = "crates/ferret-git" }
ferret-platform = { path = "crates/ferret-platform" }
ferret-remote = { path = "crates/ferret-remote" }
ferret-search = { path = "crates/ferret-search" }
ferret-searchd = { path = "crates/ferret-searchd" }
ferret-ui = { path = "crates/ferret-ui" }
ferret-settings = { path = "crates/ferret-settings" }
ferret-terminal = { path = "crates/ferret-terminal" }
ferret-vfs = { path = "crates/ferret-vfs" }

# Every crate below this line is already in `Cargo.lock` — each is an edge to
# something the workspace compiles anyway, not a new package. D-38 asks that
# each one carry the job it does, so the next person knows what would justify
# removing it again.

# A-13. One case-insensitive matcher is built per keystroke and run over the
# names with no allocation on either side, instead of lowercasing both sides
# once per entry. It is also the engine search will want when that lands.
aho-corasick = "1"
anyhow = "1"
alacritty_terminal = { version = "=0.26.0", default-features = false }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs" }
arc-swap = "1"
async-channel = "2"
async-trait = "0.1"
# The allocations-per-frame budget in `ferret-ui` (`docs/audit.html` §11).
# A counting global allocator with a far better story than a hand-rolled one,
# behind ferret-ui's `dhat-heap` feature so it is compiled only when that
# budget is being run — never in a release build, never in a normal test run.
dhat = "0.3"
dirs = "6"
# The folder indices key on `EntryId`s and on names read from the user's own
# disk, never on attacker-chosen input, so they were paying SipHash for a
# threat model Ferret does not have. If a remote backend ever keys a map on
# server-supplied names, that map wants a seeded hasher instead — see §9.
foldhash = "0.2"
futures = "0.3"
# A-27 / D-39. Every date the app shows is a *local* civil date, and the
# offset for a given instant depends on the user's zone and on whether that
# instant was in daylight saving — a rules file IANA revises several times a
# year. `jiff` reads the system zoneinfo directly, where chrono and time each
# need a companion crate to do the same. Formatting is still Ferret's own
# (`format::format_date`); this owns the conversion, which is the part that
# cannot be hand-rolled correctly.
jiff = "0.2"
# D-34. Parallel enumeration for bulk file work — the tree copy today, and
# folder-size-on-demand and the operations queue's conflict scan when those
# land. Deliberately *not* used for the single-directory listing (one directory
# is one serial readdir, which no walker changes) and not for search, which
# `ignore` will own because honouring .gitignore is that feature. One walker
# per job, never both for the same job.
jwalk = "0.9"
# One call: `kill(-pid, SIGKILL)`, to end a timed-out git *and the ssh,
# credential helper or hook it started* — each of which inherited the pipes
# Ferret is reading, so killing git alone leaves the read with no EOF and the
# timeout with nothing to return. `std` can put the child in its own process
# group but gives no way to signal one.
libc = "0.2"
# D-34 / F-40. Search needs ignore-file semantics, which bulk-operation walker
# `jwalk` deliberately does not provide. The first live-search engine uses the
# serial iterator on Ferret's shared worker pool; no second implicit pool.
ignore = "0.4"
# F-41. Live content search uses ripgrep's matcher/searcher pair for binary
# detection, encodings, line accounting, and regex/literal semantics. Ferret
# still owns traversal and cancellation; these crates own bytes-to-matches.
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
# PS-2. The persistent path index: canonical path identity, fingerprints,
# crawl state, indexed roots, and FTS5 trigram substring lookup over names and
# paths. `bundled` on purpose — the trigram tokenizer needs SQLite 3.34+, and
# macOS ships an older library than that, so linking the system one would make
# the index silently unavailable on the platform Ferret targets first.
rusqlite = { version = "0.40", features = ["bundled"] }
# PS-5. The persistent content index. Tantivy owns tokenisation, the inverted
# index and BM25 ranking; it deliberately does *not* own snippets here —
# `grep-searcher` re-reads the small set of top-ranked files to produce the
# same line/column/preview shape the live path emits, so an indexed row and a
# live row are indistinguishable to the UI and dedup by construction.
tantivy = "0.26"
# PS-1. One local-socket abstraction over a Unix-domain socket on macOS and a
# named pipe on Windows, with the same blocking stream API on both. The
# alternative is two hand-written transports, one of which (Windows overlapped
# I/O against `CreateNamedPipe`) is the kind of code that is wrong in ways only
# a customer finds. No TCP listener is ever created.
interprocess = "2"
notify = "7"
portable-pty = "=0.9.0"
# Not for speed first: `std`'s poisoning was doing active harm. Every lock in
# Ferret guards a few nanoseconds — a map lookup, a `Point`, an `Option` — and
# two of them swallowed a poisoned lock into an indistinguishable "no value",
# so one panic anywhere turned icons or column widths off permanently. There is
# no poisoning here, so `lock()` returns the guard and those paths cannot exist.
parking_lot = "0.12"
# A-12. Sorting 200,000 rows on a header click is embarrassingly parallel, and
# is safe to parallelise only now that the comparator no longer allocates.
rayon = "1"
# F-40. One compiled Unicode-aware literal matcher per query. This avoids
# allocating a lowercased filename for every visited path while preserving
# explicit case-sensitive, insensitive and smart-case behavior.
regex = "1"
rust-embed = "8"
# R-D08. SSH transport, authentication, host-key checking and the agent
# client, in pure Rust — which is the whole reason an SFTP mount needs no
# FUSE, no macFUSE and no WinFsp (D-06), and builds identically on both
# targets with no C toolchain. `ring` rather than the default `aws-lc-rs`
# backend: the latter builds C and CMake, which is precisely the dependency
# this crate was chosen to avoid.
russh = { version = "0.63", default-features = false, features = ["ring"] }
# The SFTP subsystem over `russh`. Listings use its *raw* session — `opendir`
# plus repeated `readdir` — so one SSH_FXP_NAME response becomes one entry
# batch; the convenience `read_dir` returns a synchronous iterator, which
# would collect a whole remote directory before the first row could paint.
russh-sftp = "2.4"
# Passwords and key passphrases in the OS credential store — Keychain on
# macOS, Credential Manager on Windows. Nothing else in the tree may hold a
# secret, and no file Ferret writes ever contains one.
keyring = "4"
# F-20 asks that hosts be imported from `~/.ssh/config` rather than retyped.
# Parsed permissively and treated as *suggestions that pre-fill the dialog*:
# a user's ssh config is theirs, and misreading one keyword must never change
# how Ferret connects.
ssh2-config = "0.8"
# `russh` is built on Tokio while Ferret runs GPUI's executors and smol, so
# the bridge is explicit rather than accidental: one runtime, two worker
# threads, created on the first connection and confined to `ferret-remote`.
# Two, fixed — this work is latency-bound, and a fourth core-count-sized pool
# beside `ferret_vfs::pool`, smol's blocking pool and GPUI's executor would
# oversubscribe the machine. Already in `Cargo.lock` via `zed-reqwest`, so
# this is an edge to something the workspace compiles anyway.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "time",
    # Transfers read and write the local side of a copy on the remote runtime,
    # so the local file I/O has to be async there too — a blocking read would
    # stall one of only two worker threads.
    "fs",
] }
# Bounded collections that never reach the heap: at most four table columns,
# at most two of them hideable.
smallvec = "1"
smol = "2"
# D-35. `SmolStr` stores up to 22 bytes inline, so cloning an `Entry` whose
# name fits — which is most of them — costs a memcpy rather than a heap
# allocation and an atomic. `gpui::SharedString` is a newtype over this same
# type, so the render boundary converts for free; `ferret-vfs` takes the leaf
# crate directly rather than a GPUI dependency it is documented not to have.
#
# `serde` is on because search's local IPC carries entry names across a process
# boundary (PS-1); `SmolStr`'s own impl keeps the short-string representation
# instead of round-tripping through `String`.
smol_str = { version = "0.3", features = ["serde"] }
thiserror = "2"
trash = "5"

# Windows icon lookup (D-18). Already in the tree via gpui's dependencies.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

# `RenderImage` is built from `image::Frame`, so the OS icon path needs the
# same `image` version gpui itself uses. No codecs: only the buffer types.
image = { version = "0.25", default-features = false }

# macOS icon lookup (D-18). All three crates are already in the tree via gpui,
# so these are direct edges to something already compiled rather than a new
# dependency stack.
# The `profiling` facade, already in the lock because `gpui` and `wgpu` pull
# it. Its `scope!` macros compile to nothing until a backend feature is on, and
# GPUI's draw path is already annotated — `window.rs` carries
# `#[profiling::function]` and calls `finish_frame!()`. Turning a backend on is
# therefore the whole of the instrumentation work. See `ferret`'s `profile`
# feature; nothing is pulled in unless it is enabled.
profiling = { version = "1", default-features = false }

objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.2", features = [
    "NSWorkspace",
    "NSImage",
    "NSImageRep",
    "NSGraphics",
    "NSBitmapImageRep",
    "NSGraphicsContext",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
# Ferret links GPUI, so the debug info the linker has to chew through dominates
# an incremental build. Line tables are all a *backtrace* needs — file and line
# for every frame — at a fraction of full DWARF.
#
# The trade is real and worth knowing: this is enough to read a panic and to
# step through code, and not enough to inspect variables in lldb. If you are
# debugging interactively, `cargo build --config 'profile.dev.debug=true'` gets
# them back for one build without touching this file. `split-debuginfo` is the
# other half and is platform-specific, so it lives in `.cargo/config.toml`.
debug = "line-tables-only"

# GPUI is unusably slow when its dependencies are built unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
