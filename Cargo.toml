[workspace]
resolver = "2"
members = [
    "crates/ferret", "crates/ferret-platform",
    "crates/ferret-settings",
    "crates/ferret-ui",
    "crates/ferret-vfs",
    "xtask",
]
default-members = ["crates/ferret"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/ferret-fm/ferret"

[workspace.dependencies]
# GPUI is tracked from Zed's Git repository; the exact commit is pinned by Cargo.lock.
# `gpui-component` resolves `gpui` from the same Git source, so Cargo unifies both to a
# single crate instance. Do not add a `rev` to one without pinning the other to match.
gpui = { git = "https://github.com/zed-industries/zed" }
# Ferret targets macOS and Windows for now; the Linux backends are not enabled
# here. Note that `gpui-base` still turns `wayland` and `x11` on transitively,
# and Cargo unions features — so this expresses intent rather than excluding
# code from the build. Keep `ferret-platform`'s trait boundary intact so Linux
# is a re-add rather than a rewrite. See D-19.
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    # Stitch the Metal shaders and compile them at runtime instead of invoking
    # `xcrun metal` from gpui_macos's build script. Without this, building on macOS
    # requires the Metal compiler, which ships only inside full Xcode — Command Line
    # Tools alone fail with `unable to find utility "metal"`. `gpui-base` already
    # turns this on transitively; we declare it so the macOS build does not silently
    # depend on a feature some other crate happens to enable.
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
# Embedded SVGs backing `IconName`. Without registering these as the app's asset
# source, every gpui-component icon renders empty.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

ferret-platform = { path = "crates/ferret-platform" }
ferret-ui = { path = "crates/ferret-ui" }
ferret-settings = { path = "crates/ferret-settings" }
ferret-vfs = { path = "crates/ferret-vfs" }

# Every crate below this line is already in `Cargo.lock` — each is an edge to
# something the workspace compiles anyway, not a new package. D-38 asks that
# each one carry the job it does, so the next person knows what would justify
# removing it again.

# A-13. One case-insensitive matcher is built per keystroke and run over the
# names with no allocation on either side, instead of lowercasing both sides
# once per entry. It is also the engine search will want when that lands.
aho-corasick = "1"
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
# The folder indices key on `EntryId`s and on names read from the user's own
# disk, never on attacker-chosen input, so they were paying SipHash for a
# threat model Ferret does not have. If a remote backend ever keys a map on
# server-supplied names, that map wants a seeded hasher instead — see §9.
foldhash = "0.2"
async-channel = "2"
dirs = "6"
futures = "0.3"
notify = "7"
# A-12. Sorting 200,000 rows on a header click is embarrassingly parallel, and
# is safe to parallelise only now that the comparator no longer allocates.
rayon = "1"
rust-embed = "8"
smol = "2"
# D-35. `SmolStr` stores up to 22 bytes inline, so cloning an `Entry` whose
# name fits — which is most of them — costs a memcpy rather than a heap
# allocation and an atomic. `gpui::SharedString` is a newtype over this same
# type, so the render boundary converts for free; `ferret-vfs` takes the leaf
# crate directly rather than a GPUI dependency it is documented not to have.
smol_str = "0.3"
thiserror = "2"
trash = "5"

# Windows icon lookup (D-18). Already in the tree via gpui's dependencies.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
] }

# `RenderImage` is built from `image::Frame`, so the OS icon path needs the
# same `image` version gpui itself uses. No codecs: only the buffer types.
image = { version = "0.25", default-features = false }

# macOS icon lookup (D-18). All three crates are already in the tree via gpui,
# so these are direct edges to something already compiled rather than a new
# dependency stack.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.2", features = [
    "NSWorkspace",
    "NSImage",
    "NSImageRep",
    "NSGraphics",
    "NSBitmapImageRep",
    "NSGraphicsContext",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0

# GPUI is unusably slow when its dependencies are built unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
